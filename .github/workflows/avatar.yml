name: Avatar (free GPU)
# Renders the realistic AI presenter: Modal InfiniteTalk ("backend": "infinitetalk"), Modal OmniAvatar ("modal") or Kaggle (default).
# Separate from the Instagram publisher: this workflow never posts anything.
on:
  push:
    branches: [main]
    paths:
      - 'avatar/requests/*.json'
  workflow_dispatch:
concurrency:
  group: avatar-render
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render pending avatar requests
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          pip install -q kaggle modal
          command -v ffmpeg >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          shopt -s nullglob
          mkdir -p avatar/out
          for req in avatar/requests/*.json; do
            name=$(basename "$req" .json)
            out="avatar/out/$name.mp4"
            [ -f "$out" ] && continue
            backend=$(python -c "import json;print(json.load(open('$req')).get('backend','kaggle'))")
            echo "== $name via $backend"
            rc=0
            if [ "$backend" = "infinitetalk" ]; then
              image=$(python -c "import json;print(json.load(open('$req'))['image'])")
              audio=$(python -c "import json;print(json.load(open('$req'))['audio'])")
              size=$(python -c "import json;print(json.load(open('$req')).get('size','infinitetalk-480'))")
              PYTHONUNBUFFERED=1 modal run tools/avatar_infinitetalk.py --image "$image" --audio "$audio" --size "$size" --out "$out" > "avatar/out/$name.log" 2>&1 || rc=$?
            elif [ "$backend" = "modal" ]; then
              image=$(python -c "import json;print(json.load(open('$req'))['image'])")
              audio=$(python -c "import json;print(json.load(open('$req'))['audio'])")
              PYTHONUNBUFFERED=1 modal run tools/avatar_modal.py --image "$image" --audio "$audio" --out "$out" > "avatar/out/$name.log" 2>&1 || rc=$?
            else
              if [ -z "$KAGGLE_KEY" ]; then echo "KAGGLE_KEY not set" > "avatar/out/$name.log"; continue; fi
              PYTHONUNBUFFERED=1 python tools/kaggle_avatar.py "$req" "$out" > "avatar/out/$name.log" 2>&1 || rc=$?
            fi
            echo "exit code $rc" >> "avatar/out/$name.log"
            # phone-footage finishing pass (free, on this runner): 1080x1920, grain, slight handheld drift
            if [ -f "$out" ]; then bash tools/polish_video.sh "$out" "avatar/out/${name}_final.mp4" || true; fi
            tail -30 "avatar/out/$name.log"
          done
      - name: Save results
        if: always()
        run: |
          git add avatar/out 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "fix-my-money-bot"
            git config user.email "noreply@github.com"
            git commit -q -m "Avatar rendered: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase && git push -q
          fi
