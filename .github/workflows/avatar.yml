name: Avatar (Modal)
# Renders the realistic AI presenter on Modal's free monthly credit. Separate from the
# Instagram publisher: this workflow never posts anything.
on:
  push:
    branches: [main]
    paths:
      - 'avatar/requests/*.json'
  workflow_dispatch:
concurrency:
  group: avatar-modal
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render pending avatar requests
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          if [ -z "$MODAL_TOKEN_ID" ]; then echo "MODAL_TOKEN_ID not set; nothing to do"; exit 0; fi
          pip install -q modal
          shopt -s nullglob
          for req in avatar/requests/*.json; do
            name=$(basename "$req" .json)
            out="avatar/out/$name.mp4"
            [ -f "$out" ] && continue
            image=$(python -c "import json,sys;print(json.load(open('$req'))['image'])")
            audio=$(python -c "import json,sys;print(json.load(open('$req'))['audio'])")
            steps=$(python -c "import json,sys;print(json.load(open('$req')).get('steps',4))")
            echo "== $name: $image + $audio ($steps steps)"
            mkdir -p avatar/out
            rc=0
            PYTHONUNBUFFERED=1 modal run tools/avatar_modal.py --image "$image" --audio "$audio" --out "$out" --steps "$steps" > "avatar/out/$name.log" 2>&1 || rc=$?
            echo "exit code $rc" >> "avatar/out/$name.log"
            tail -40 "avatar/out/$name.log"
          done
      - name: Save results
        run: |
          git add avatar/out 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name "fix-my-money-bot"
            git config user.email "noreply@github.com"
            git commit -q -m "Avatar rendered: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase && git push -q
          fi
