name: Publish to Instagram
on:
  push:
    branches: [main]
    # Only the queue triggers a run. Media files are uploaded first, one commit each,
    # and a job that fired halfway through that would find its slides missing.
    paths:
      - 'queue/**'
      - 'specs/**'
      - 'voice/request.json'
  schedule:
    # :50 past the hour, so a post due at 13:45 UTC (19:15 IST) goes out at ~19:20 IST.
    - cron: '50 * * * *'
  workflow_dispatch:
concurrency:
  group: instagram-publish
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Let the Pages deploy settle
        if: github.event_name == 'push'
        run: sleep 45
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Narrated reels are rendered here, because the voice key only exists in this
      # repo's secrets. Output is committed, then Pages is asked to redeploy so
      # Instagram can fetch it.
      - name: Build narrated reels and voice samples
        continue-on-error: true
        env:
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
        run: |
          pip install -q numpy pillow
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          python tools/build.py

      - name: Save built media and redeploy Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add media voice queue 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git config user.name  "fix-my-money-bot"
            git config user.email "noreply@github.com"
            git commit -q -m "Built: $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase && git push -q
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/pages/builds" | head -c 300; echo
            sleep 60
          fi
      - name: Publish anything pending
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          PAGES_BASE: ${{ vars.PAGES_BASE }}
        run: python tools/publish.py
      - name: Daily metrics snapshot
        if: always()
        continue-on-error: true
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python tools/metrics.py

      - name: Record what went live
        if: always()
        run: |
          git add published.json metrics 2>/dev/null || true
          if [ -n "$(git status --porcelain published.json metrics)" ]; then
            git config user.name  "fix-my-money-bot"
            git config user.email "noreply@github.com"
            git commit -m "Published: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
